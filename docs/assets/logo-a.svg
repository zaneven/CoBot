<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
  <!-- Antenna -->
  <rect x="11" y="1" width="2" height="2" fill="#5FD38A"/>
  <rect x="11" y="3" width="2" height="2" fill="#8C530D"/>
  <!-- Ear bolts -->
  <rect x="2" y="10" width="2" height="5" fill="#8C530D"/>
  <rect x="2" y="11" width="1" height="3" fill="#F5BC4C"/>
  <rect x="20" y="10" width="2" height="5" fill="#8C530D"/>
  <rect x="21" y="11" width="1" height="3" fill="#F5BC4C"/>
  <!-- Head Shell -->
  <rect x="6" y="5" width="12" height="2" fill="#F5BC4C"/>
  <rect x="4" y="7" width="2" height="13" fill="#F5BC4C"/>
  <rect x="6" y="7" width="12" height="1" fill="#E8A33D"/>
  <rect x="18" y="7" width="2" height="13" fill="#8C530D"/>
  <rect x="4" y="20" width="16" height="1" fill="#8C530D"/>
  <rect x="5" y="6" width="1" height="1" fill="#F5BC4C"/>
  <rect x="18" y="6" width="1" height="1" fill="#8C530D"/>
  <!-- Face Screen -->
  <rect x="6" y="8" width="12" height="9" fill="#070A10"/>
  <!-- Eyes -->
  <rect x="8" y="10" width="2" height="3" fill="#5FD38A"/>
  <rect x="8" y="10" width="1" height="1" fill="#E6EDF3"/>
  <rect x="14" y="10" width="2" height="3" fill="#5FD38A"/>
  <rect x="14" y="10" width="1" height="1" fill="#E6EDF3"/>
  <!-- Smile & Cheek -->
  <rect x="10" y="14" width="4" height="1" fill="#E8A33D"/>
  <rect x="7" y="13" width="1" height="1" fill="#F5BC4C" fill-opacity="0.6"/>
  <rect x="16" y="13" width="1" height="1" fill="#F5BC4C" fill-opacity="0.6"/>
  <!-- Chin / Collar -->
  <rect x="7" y="18" width="10" height="2" fill="#E8A33D"/>
  <rect x="8" y="21" width="8" height="2" fill="#1E2A3A"/>
  <rect x="10" y="21" width="4" height="1" fill="#8391A6"/>
</svg>
