# CoBot configuration. Copy to config.yaml and edit.
# Paths here are whitelisted for /bind (the bot will only bind TG chats to these dirs).

# Dev root directories whose immediate subdirectories are switchable projects.
# Use /projects in Telegram to list them and tap to switch the active project.
devRoots:
  - /Users/YOU/Develop

# Additional explicitly whitelisted project paths (outside the dev roots).
# Useful for directories like ~/.hermes that aren't top-level dev projects.
projects:
  # - /Users/YOU/.hermes

# Streaming display & bot authorization options.
telegram:
  botToken: "" # Telegram Bot Token (e.g. 123456789:ABCDefgh...)
  allowedUsers: [12345678] # Whitelisted Telegram User IDs allowed to control the bot
  maxEditChars: 3500 # chars before appending a new chunk message
  pollTimeout: 30 # long-poll timeout (seconds)
  flushMs: 900 # ms between streamed edits

# Interactive tool-call approval. Override per-chat at runtime with /approve.
# env: COBOT_APPROVAL_MODE, COBOT_APPROVAL_TIMEOUT_MS, COBOT_APPROVAL_TIMEOUT_ACTION,
#      COBOT_APPROVAL_SKIP_TOOLS (comma-separated).
approval:
  mode: auto # auto = headless auto-approve; interactive = prompt for mutating tools
  timeoutMs: 300000 # per-request approval timeout (must be < taskTimeoutMs)
  timeoutAction: allow # decision when the user doesn't respond: allow | deny
  skipTools: [Read, LS, Glob, Grep, TodoWrite, TaskCreate, TaskUpdate, TaskList, TaskGet] # never prompt for these (read-only)

# Defaults applied to every Claude run unless overridden by env / a /run flag.
defaults:
  # model: "claude-3-7-sonnet-20250219" # default Claude model (env CLAUDE_MODEL overrides)
  # models: [] # button pick list for the Telegram /models command (env CLAUDE_MODELS overrides).
               # Per-chat picks (/models in Telegram) win over `model`; unset everywhere = SDK default.
  maxTurns: 50 # cap on agentic turns per task (DEFAULT_MAX_TURNS = 50, 0 = unlimited)
  taskTimeoutMs: 600000 # hard per-task wall-clock timeout in ms (default 10 min, must be > approval.timeoutMs)
  dailyCostCapUsd: 200.0 # example: $5 per chat per day (undefined = no cap)
  dailyTokenCap: 20000000 # example: 200k tokens per chat per day (undefined = no cap)
  showTraceText: true # true = include intermediate narration trace text blocks in the final reply

# Built-in Web Admin Panel configuration
admin:
  enabled: true # true = start Web Admin HTTP server on startup
  host: "127.0.0.1" # HTTP listen host
  port: 8085 # HTTP listen port
  authEnabled: true # whether bearer token authentication is required (default: true)
  apiKey: "" # Secret key for Admin API bearer authentication

